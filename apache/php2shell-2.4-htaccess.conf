# Orbisius PHP Security — php2shell stopgap (CVE-2026-109618 / CVE-2026-109619), Apache 2.4, .htaccess edition.
# NO-ROOT / shared-hosting edition: save it into your document root as .htaccess, or paste it at the TOP
# of an existing .htaccess (above the app's own rules). Takes effect on the next request, no reload; needs
# AllowOverride FileInfo. STOPGAP, not a fix — update PHP, then remove this. Educational use, no warranty,
# you are responsible for what you deploy. Full setup, caveats and proof steps: README.
#
# No php_admin_flag block here — it is not valid in .htaccess (it 500s the site). The rewrite rule below
# already blocks the multipart upload-progress delivery (CVE-2026-109619) for non-allowlisted clients; to
# ALSO switch PHP's session.upload-progress feature off you need root — use the server/vhost edition.
#
# EDIT the allowlist: replace 203.0.113.5 / 198.51.100.7 (they match nobody) with your admin IPs or CIDR
# ranges, in BOTH the RewriteCond and the <If>. -R takes a single IP or a CIDR range. Behind a CDN / proxy
# do NOT allowlist the proxy IP (it exempts everyone) — see the README.

# Reject a multipart or >=1MB body on any body-carrying method (not GET/HEAD) from a non-allowlisted client.
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} !^(GET|HEAD)$
    # REPLACE both placeholder IPs below with your admin IP/CIDR — they match nobody as-is:
    RewriteCond expr "! (-R '203.0.113.5' || -R '198.51.100.7')"
    RewriteCond %{HTTP:Content-Type} multipart/form-data [NC,OR]
    RewriteCond %{HTTP:Content-Length} [0-9]{7,}$
    RewriteRule ^ - [R=404,L,E=ORBISIUS_CVE_MULTIPART_BLOCK:1]
</IfModule>

# Cap non-allowlisted request bodies at 512 KB (admins exempt) — catches a chunked large body the header
# rule misses. Keep it under ~1 MiB. Works in .htaccess under AllowOverride FileInfo.
# REPLACE both placeholder IPs below with your admin IP/CIDR — they match nobody as-is:
<If "! (-R '203.0.113.5' || -R '198.51.100.7')">
    LimitRequestBody 524288
</If>
